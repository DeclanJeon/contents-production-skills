name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Korean test font and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg

      - name: Install test dependencies
        run: python -m pip install pytest Pillow "pydantic>=2,<3" typer

      - name: Version consistency
        run: python scripts/check_versions.py

      - name: Unit tests
        run: python -m pytest -q -rs

      - name: Build archive
        run: python scripts/build_release.py --out dist --tag "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Contents Production Skills $VER" \
            --notes-file "docs/release-notes/$VER.md"

      - name: Notify landing page
        env:
          TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::LANDING_DISPATCH_TOKEN not set; the landing page picks this release up on its daily sync."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/DeclanJeon/cineforge-landing/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"product\":\"skills\",\"version\":\"$VER\"}}"
