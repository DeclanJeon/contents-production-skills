name: ci

on:
  push:
  pull_request:

jobs:
  media-studio:
    name: Media Studio (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Storage, audit and platform path contracts
        run: python -m pytest recording-production-history/scripts -q -rs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Korean test font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install ffmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install test dependencies
        run: python -m pip install pytest Pillow "pydantic>=2,<3" typer

      - name: Version consistency
        run: python scripts/check_versions.py

      - name: JSON artifacts
        run: >
          python -c
          "import json, pathlib;
          paths = [pathlib.Path('manifest.json'), *sorted(pathlib.Path('qa').glob('json' if False else '*.json'))];
          [json.loads(p.read_text(encoding='utf-8')) for p in paths];
          print(f'json ok: {len(paths)} file(s)')"

      - name: Unit tests
        run: python -m pytest -q -rs

      - name: Sync dry run
        run: python scripts/sync_installed.py --dry-run --quiet
