name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Version consistency
        run: python scripts/check_versions.py

      - name: JSON artifacts
        run: >
          python -c
          "import json, pathlib;
          paths = [pathlib.Path('manifest.json'), *sorted(pathlib.Path('qa').glob('json' if False else '*.json'))];
          [json.loads(p.read_text(encoding='utf-8')) for p in paths];
          print(f'json ok: {len(paths)} file(s)')"

      - name: Unit tests
        run: python -m pytest scripts -q

      - name: Sync dry run
        run: python scripts/sync_installed.py --dry-run --quiet
