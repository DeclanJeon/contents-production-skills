[pytest]
# The `video-production-assets/support/` tree is a generated build artifact
# (git-ignored, regenerated by scripts/sync_installed.py) that duplicates the
# committed `qa/` payload with identical test module basenames. Excluding it
# keeps a local `python -m pytest -q` collection identical to CI, which checks
# out the committed tree without the derived payload.
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    video-production-assets/support
    *pytest-skill-final*
